<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>رحلة البطل إلى المسجد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#24305e;--sun:#ffd23f;--mint:#3ec28f;--coral:#ff6b4a;--sky:#8fd8ff;--card:#fffdf6}
body{font-family:"Cairo","Tajawal","Segoe UI",Tahoma,sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;background:#bfe9ff;transition:background .6s}
body.t0{background:linear-gradient(#8fd8ff,#e9fbff 60%,#b8f0c8)}
body.t1{background:linear-gradient(#ffe3c8,#fff3e6)}
body.t2{background:linear-gradient(#c9f5c0,#f0ffe6)}
body.t3{background:linear-gradient(#a8e6ff,#e6f8ff)}
body.t4{background:linear-gradient(#fff0b8,#fffbe6)}
body.t5{background:linear-gradient(#7fd0ff,#e3f6ff)}
body.t6{background:linear-gradient(#b5f0e6,#e8fff9)}
body.t7{background:linear-gradient(#3b2f7a,#6b58c9 70%,#9a84f0)}
.scr{max-width:980px;margin:auto;padding:10px 12px 50px}
.center{text-align:center}
h1{font-size:clamp(34px,8vw,64px);font-weight:900;color:#fff;text-shadow:0 4px 0 #e5832a,0 8px 0 #c76a14,0 12px 18px #0003;line-height:1.2;margin:6px 0}
.btn{font:inherit;font-weight:900;font-size:clamp(18px,4.5vw,26px);background:var(--sun);color:var(--ink);border:0;border-radius:40px;padding:12px 34px;box-shadow:0 6px 0 #d99a00,0 10px 16px #0003;cursor:pointer;margin:6px;transition:transform .1s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #d99a00}
.btn.g{background:var(--mint);box-shadow:0 6px 0 #25906a,0 10px 16px #0003;color:#fff}
.btn.b{background:#5aa9ff;box-shadow:0 6px 0 #2f78cc,0 10px 16px #0003;color:#fff}
.btn.s{font-size:16px;padding:7px 16px}
.btn:disabled{opacity:.45;filter:grayscale(.6);cursor:not-allowed}
.card{background:var(--card);border-radius:26px;padding:16px;box-shadow:0 8px 0 #0001,0 14px 24px #0002;margin:10px 0}
.bubble{background:#fff;border:4px solid var(--sun);border-radius:24px;padding:12px 16px;font-size:clamp(16px,3.6vw,20px);font-weight:800;line-height:1.7;position:relative;text-align:right}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
input.nm{font:inherit;font-weight:800;font-size:22px;text-align:center;border:4px solid var(--sun);border-radius:30px;padding:10px 18px;width:min(320px,90%);color:var(--ink);outline:0}
.hero{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.hud{position:sticky;top:6px;z-index:20;background:#fffdf6ee;border-radius:22px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;box-shadow:0 6px 16px #0003;margin-bottom:8px;backdrop-filter:blur(6px)}
.chip{background:#fff3c4;border-radius:20px;padding:4px 14px;font-weight:900;font-size:18px}
.bdgs{display:flex;gap:3px}.bdgs svg{width:34px;height:40px}
.ib{font:inherit;font-size:20px;background:#fff;border:3px solid #e2ecf5;border-radius:16px;padding:3px 10px;cursor:pointer;font-weight:800}
.ib:active{transform:scale(.94)}
.prog{height:16px;background:#fff;border-radius:10px;overflow:hidden;border:3px solid #fff;box-shadow:inset 0 2px 4px #0003;margin:6px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#3ec28f,#ffd23f);transition:width .8s}
.scene{border-radius:22px;overflow:hidden;line-height:0;box-shadow:0 6px 14px #0002}.scene svg{width:100%;height:auto}
.q{font-size:clamp(20px,4.6vw,28px);font-weight:900;line-height:1.6;margin:6px 0 12px}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:800;opacity:.85}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.opt{font:inherit;font-weight:900;font-size:clamp(18px,4.2vw,24px);background:#fff;border:4px solid #cfe3ff;border-radius:22px;padding:14px 8px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 #b5cdf0;transition:.15s}
.opt:hover{border-color:var(--sun);transform:translateY(-3px)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #b5cdf0}
.opt svg{width:90px;height:100px}
.opt.tf{font-size:28px}
.pool,.targets{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0;min-height:60px}
.pool{background:#eaf4ff;border:3px dashed #9cc7f5;border-radius:20px;padding:10px}
.slot{flex:1 1 150px;min-height:150px;background:#fff7d6;border:4px dashed #f0b429;border-radius:20px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.slot>b{font-size:18px}
.dcard{background:#fff;border:3px solid #cfe3ff;border-radius:18px;padding:6px 10px;width:130px;text-align:center;font-weight:800;cursor:grab;touch-action:none;user-select:none;box-shadow:0 4px 0 #b5cdf0;font-size:15px}
.dcard svg{width:64px;height:64px;display:block;margin:auto}
.dcard.sel{border-color:var(--coral);transform:scale(1.07)}
.ghost{position:fixed;z-index:999;pointer-events:none;opacity:.9;transform:rotate(-4deg) scale(1.05)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:4px solid #cfe3ff;border-radius:18px;padding:10px 14px;font-weight:900;font-size:20px;margin:8px 0;cursor:pointer}
.mrow.sel{border-color:var(--coral);background:#fff1ec}
.mrow i{font-style:normal;background:#e8f7ee;border-radius:14px;padding:2px 12px;min-width:90px;text-align:center;color:#1b7f56}
.mchips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.mchips .opt{padding:10px 16px;font-size:19px}
.sky{position:relative;height:330px;background:linear-gradient(#7fd0ff,#dff5ff);border-radius:22px;overflow:hidden}
.sky:before{content:"☁️  ☁️";position:absolute;top:20px;right:20px;font-size:50px;opacity:.8;letter-spacing:140px}
.bal{position:absolute;bottom:-100px;width:74px;height:92px;background:radial-gradient(circle at 30% 30%,#fff9,transparent 35%),var(--c);border-radius:50% 50% 48% 48%;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:rise 8s linear infinite;box-shadow:inset -8px -10px 14px #0003}
.bal b{font-size:36px;color:#fff;text-shadow:0 2px 4px #0006}.bal u{position:absolute;bottom:-34px;left:50%;width:2px;height:34px;background:#555}
@keyframes rise{0%{transform:translate(0,0)}25%{transform:translate(20px,-100px)}50%{transform:translate(-20px,-220px)}75%{transform:translate(20px,-330px)}100%{transform:translate(0,-470px)}}
.bal.pop{animation:popb .25s forwards}@keyframes popb{to{transform:scale(1.8);opacity:0}}
.body{width:min(240px,70%);display:block;margin:auto}.bp{cursor:pointer}.bp:hover *{filter:brightness(1.15) drop-shadow(0 0 6px #ffd23f)}.bp.hit *{fill:#ff9b85}
.tv{background:#1b2347;border-radius:20px;padding:8px;margin-bottom:10px}.tv svg{width:100%;height:auto;max-height:250px;display:block}
.zz{animation:zz 2.4s infinite;font-weight:900}@keyframes zz{0%{opacity:0;transform:translate(0,10px)}50%{opacity:1}100%{opacity:0;transform:translate(14px,-26px)}}
.drop{animation:drop 1s infinite}@keyframes drop{0%{transform:translateY(-6px);opacity:0}50%{opacity:1}100%{transform:translateY(26px);opacity:0}}
.word{background:#fff;border:3px solid #cfe3ff;border-radius:16px;padding:6px 14px;font-size:24px;font-weight:900;cursor:pointer;font-family:"Amiri","Cairo",serif}
.line{min-height:64px;background:#fff7d6;border:4px dashed #f0b429;border-radius:20px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.fb{position:fixed;inset:0;background:#0007;z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}
.fbc{background:#fff;border-radius:30px;padding:22px;max-width:480px;width:100%;text-align:center;animation:pp .4s cubic-bezier(.3,1.6,.5,1);box-shadow:0 0 0 8px var(--sun)}
.fbc.bad{box-shadow:0 0 0 8px #ff9b85}.fbc h2{font-size:34px;margin:6px 0}.fbc p{font-size:19px;font-weight:700;line-height:1.7;margin:6px 0}
@keyframes pp{from{transform:scale(.4);opacity:0}}
.fx{position:fixed;z-index:150;font-size:34px;pointer-events:none;animation:fl 1.6s ease-out forwards}
@keyframes fl{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
.spark{position:fixed;z-index:150;width:10px;height:10px;border-radius:50%;pointer-events:none;animation:fl 1.2s ease-out forwards;box-shadow:0 0 10px currentColor}
.bigbadge svg{width:170px;height:200px;animation:pp .8s cubic-bezier(.3,1.6,.5,1)}
.door{transition:transform 3.2s ease-in-out;transform-box:fill-box}.open .dl{transform:translateX(-100%)}.open .dr{transform:translateX(100%)}
.glow{opacity:0;transition:opacity 3s}.open .glow{opacity:1}
.lb{width:100%;border-collapse:collapse;font-size:20px;font-weight:800}.lb td,.lb th{padding:8px;border-bottom:2px dashed #e6d9a8;text-align:center}.lb th{background:#fff3c4}
.modal{position:fixed;inset:0;background:#0008;z-index:200;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
.mbox{background:#fffdf6;border-radius:28px;padding:18px;max-width:640px;width:100%;max-height:92vh;overflow:auto}
.mbox li{margin:6px 22px;line-height:1.7;font-weight:700}
textarea{font:inherit;width:100%;min-height:90px;border:3px solid #cfe3ff;border-radius:16px;padding:10px;font-size:22px}
.cert{background:#fffdf0;border:14px double #d99a00;padding:30px;text-align:center;border-radius:10px;color:#3a2b00}
.cert h2{font-size:44px;color:#b5760a}.cert p{font-size:24px;line-height:2;font-weight:700}
#cw{display:none}#cw.show{display:flex}
@media print{body{background:#fff!important}#app,.hud,.fb,.modal:not(#cw){display:none!important}#cw{display:block!important;position:static;background:none}#cw .noprint{display:none}@page{size:A4 landscape;margin:10mm}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<radialGradient id="gold" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#fff7b0"/><stop offset=".45" stop-color="#ffd23f"/><stop offset="1" stop-color="#c77f00"/></radialGradient>
<radialGradient id="grey" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#f1f1f1"/><stop offset="1" stop-color="#a9b0bd"/></radialGradient>
</defs></svg>
<div id="app"></div><div id="cw" class="modal"></div>
<script>
/* ===== إعدادات يمكن للمعلمة تعديلها ===== */
const CFG={
 AUDIO:{ok:'',bad:'',win:'',music:'',tashahhud:''}, // ضعي مسارات ملفات صوتية (mp3) لتحل محل المؤثرات المولّدة
 VIDEO:{nawaqid:''} // مسار فيديو قصير للمرحلة 3 (اختياري)
};
const LS='heroMosque.';
const $=s=>document.querySelector(s),shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const sk='#ffd9b0';
let ST={name:'',pts:{},done:{},t0:0,id:''},stage=0,qi=0,qStart=0,tries=0,locked=false,tick=null,started=false,mute=false,music=true;
const score=()=>Object.values(ST.pts).reduce((a,b)=>a+b,0),nb=()=>Object.keys(ST.done).length;
const tp=s=>s<10?100:s<=20?60:30;
const fmt=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const ls={get:k=>{try{return localStorage.getItem(LS+k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(LS+k,v)}catch(e){}}};

/* ===== الصوت ===== */
let AC,musEl;
const ac=()=>AC||(AC=new(window.AudioContext||window.webkitAudioContext)());
function tone(f,d,ty='sine',v=.15,at=0){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.value=f;const t=c.currentTime+at;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
function noise(d){try{const c=ac(),n=c.sampleRate*d,b=c.createBuffer(1,n,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();f.type='bandpass';f.frequency.value=1800;g.gain.value=.25;s.buffer=b;s.connect(f);f.connect(g);g.connect(c.destination);s.start()}catch(e){}}
function sfx(k){if(mute)return;const u=CFG.AUDIO[k];if(u){new Audio(u).play().catch(()=>{});return}
 const m={ok(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.18,i*.09))},bad(){tone(200,.25,'sawtooth',.1);tone(150,.35,'sawtooth',.1,.18)},win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.3,'triangle',.2,i*.14))},pop(){tone(700,.07,'square',.08)},water(){noise(.9)},tap(){tone(500,.05,'sine',.08)}};m[k]&&m[k]()}
function say(t){if(mute||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.95;u.pitch=1.2;speechSynthesis.speak(u)}catch(e){}}
const PEN=[392,440,523,587,659,784];let mi=2;
setInterval(()=>{if(mute||!music||!started||CFG.AUDIO.music)return;mi=Math.max(0,Math.min(5,mi+[-1,0,1,1,-2,2][Math.random()*6|0]));tone(PEN[mi],1.5,'sine',.04);if(Math.random()<.3)tone(PEN[mi]/2,2,'sine',.025)},650);
function musUpdate(){if(!CFG.AUDIO.music)return;if(!musEl){musEl=new Audio(CFG.AUDIO.music);musEl.loop=true;musEl.volume=.35}(mute||!music)?musEl.pause():musEl.play().catch(()=>{})}
function togSound(){mute=!mute;if(mute&&window.speechSynthesis)speechSynthesis.cancel();musUpdate();hudRefresh()}
function togMusic(){music=!music;musUpdate();hudRefresh()}

/* ===== مؤثرات بصرية ===== */
function stars(n=16,ch='⭐'){for(let i=0;i<n;i++){const s=document.createElement('span');s.className='fx';s.textContent=ch;s.style.cssText=`left:${Math.random()*100}vw;top:${40+Math.random()*30}vh;--dx:${(Math.random()-.5)*300}px;--dy:${-120-Math.random()*240}px;animation-delay:${Math.random()*.3}s`;document.body.appendChild(s);setTimeout(()=>s.remove(),2000)}}
function fireworks(){let c=0;const iv=setInterval(()=>{const x=10+Math.random()*80,y=15+Math.random()*40,col=['#ffd23f','#ff6b4a','#3ec28f','#5aa9ff','#c77dff'][c%5];for(let i=0;i<18;i++){const d=document.createElement('i');d.className='spark';const a=i/18*6.283;d.style.cssText=`left:${x}vw;top:${y}vh;background:${col};color:${col};--dx:${Math.cos(a)*100}px;--dy:${Math.sin(a)*100}px`;document.body.appendChild(d);setTimeout(()=>d.remove(),1400)}sfx('pop');if(++c>14)clearInterval(iv)},450)}

/* ===== رسومات SVG ===== */
const hero=(s=120,m='')=>`<svg class="hero" width="${s}" viewBox="0 0 120 150"><ellipse cx="60" cy="142" rx="36" ry="7" fill="#0002"/><path d="M28 142v-48q0-26 32-26t32 26v48z" fill="#fff" stroke="#cfd8e3" stroke-width="2"/><path d="M52 70q8 10 16 0" stroke="#3ec28f" stroke-width="3" fill="none"/><circle cx="60" cy="52" r="31" fill="${sk}"/><path d="M29 46q0-30 31-30t31 30q-31-10-62 0z" fill="#fff" stroke="#cfd8e3" stroke-width="2"/><path d="M34 40q26-9 52 0" stroke="#3ec28f" stroke-width="3" fill="none"/><ellipse cx="48" cy="56" rx="4.5" ry="6" fill="#222"/><ellipse cx="72" cy="56" rx="4.5" ry="6" fill="#222"/><circle cx="49.5" cy="53.5" r="1.7" fill="#fff"/><circle cx="73.5" cy="53.5" r="1.7" fill="#fff"/><circle cx="40" cy="66" r="5" fill="#ff9b85" opacity=".6"/><circle cx="80" cy="66" r="5" fill="#ff9b85" opacity=".6"/><path d="M50 69q10 9 20 0" stroke="#c2410c" stroke-width="3" fill="none" stroke-linecap="round"/>${m}</svg>`;
const mosque=(w=300)=>`<svg width="${w}" viewBox="0 0 300 250" style="max-width:100%"><ellipse cx="150" cy="238" rx="140" ry="10" fill="#0002"/><rect x="30" y="70" width="26" height="165" fill="#f4e4b8"/><rect x="244" y="70" width="26" height="165" fill="#f4e4b8"/><path d="M30 70l13-40 13 40zM244 70l13-40 13 40z" fill="#3ec28f"/><circle cx="43" cy="24" r="6" fill="#ffd23f"/><circle cx="257" cy="24" r="6" fill="#ffd23f"/><rect x="62" y="130" width="176" height="105" fill="#fff3d1"/><path d="M80 130q70-120 140 0z" fill="#3ec28f"/><path d="M150 18a14 14 0 1 0 8 24 11 11 0 1 1-8-24z" fill="#ffd23f"/><rect x="149" y="30" width="2" height="30" fill="#ffd23f"/><path d="M118 235v-38a32 32 0 0 1 64 0v38z" fill="#8d5a3b"/><circle cx="90" cy="165" r="10" fill="#8fd8ff"/><circle cx="210" cy="165" r="10" fill="#8fd8ff"/></svg>`;
const gate=()=>`<svg width="340" viewBox="0 0 300 250" style="max-width:100%"><defs><clipPath id="dc"><path d="M118 235v-38a32 32 0 0 1 64 0v38z"/></clipPath></defs>${mosque(300).replace(/<svg[^>]*>|<\/svg>/g,'').replace('<path d="M118 235v-38a32 32 0 0 1 64 0v38z" fill="#8d5a3b"/>','')}<rect class="glow" x="118" y="165" width="64" height="70" fill="#fff3a0"/><g clip-path="url(#dc)"><rect class="door dl" x="118" y="165" width="32" height="70" fill="#8d5a3b" stroke="#5e3a22" stroke-width="2"/><rect class="door dr" x="150" y="165" width="32" height="70" fill="#8d5a3b" stroke="#5e3a22" stroke-width="2"/></g></svg>`;
const BI=['💧','🧠','🧐','🕌','🎈','🦸','👑'],BC=['#5aa9ff','#3ec28f','#ff9f43','#c77dff','#ff6b4a','#ff4d6d','#ffd23f'];
const badge=(i,on=1)=>`<svg viewBox="0 0 100 120"><path d="M30 80l-12 36 22-10 10 12 8-36zM70 80l12 36-22-10-10 12-8-36z" fill="${on?BC[i]:'#b9c0cc'}"/><circle cx="50" cy="48" r="40" fill="${on?'url(#gold)':'url(#grey)'}" stroke="${on?'#b36b00':'#8a93a3'}" stroke-width="3"/><circle cx="50" cy="48" r="30" fill="${on?BC[i]:'#d4d9e2'}" stroke="#fff8" stroke-width="3"/><text x="50" y="60" text-anchor="middle" font-size="32" ${on?'':'opacity=".35"'}>${on?BI[i]:'🔒'}</text></svg>`;
const kid=p=>{const k=sk;let g='';
if(p=='q')g=`<rect x="44" y="42" width="32" height="58" rx="12" fill="#fff" stroke="#cfd8e3" stroke-width="2"/><rect x="48" y="98" width="10" height="28" rx="5" fill="${k}"/><rect x="62" y="98" width="10" height="28" rx="5" fill="${k}"/><circle cx="60" cy="28" r="15" fill="${k}"/><path d="M45 24a15 13 0 0 1 30 0z" fill="#fff" stroke="#cfd8e3"/><path d="M47 64q13 12 26 0" stroke="${k}" stroke-width="7" fill="none"/><circle cx="55" cy="30" r="2" fill="#222"/><circle cx="65" cy="30" r="2" fill="#222"/>`;
if(p=='r')g=`<rect x="28" y="48" width="62" height="26" rx="12" fill="#fff" stroke="#cfd8e3" stroke-width="2"/><rect x="30" y="70" width="12" height="52" rx="6" fill="${k}"/><circle cx="104" cy="58" r="15" fill="${k}"/><path d="M100 44a15 14 0 0 1 14 14z" fill="#fff" stroke="#cfd8e3"/><path d="M80 66L54 100" stroke="${k}" stroke-width="8" stroke-linecap="round"/><circle cx="106" cy="60" r="2" fill="#222"/>`;
if(p=='s')g=`<ellipse cx="55" cy="96" rx="34" ry="16" fill="#fff" stroke="#cfd8e3" stroke-width="2" transform="rotate(-18 55 96)"/><rect x="18" y="104" width="46" height="14" rx="7" fill="${k}"/><circle cx="96" cy="110" r="14" fill="${k}"/><path d="M84 104a14 12 0 0 1 24 4z" fill="#fff" stroke="#cfd8e3"/><path d="M80 98L96 120" stroke="${k}" stroke-width="8" stroke-linecap="round"/><rect x="6" y="122" width="108" height="6" rx="3" fill="#c77dff"/>`;
return `<svg viewBox="0 0 120 135">${g}</svg>`};
